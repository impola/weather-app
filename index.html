<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather</title>
  <meta name="description" content="Simple weather forecast">
  <meta name="theme-color" content="#0f172a">

  <!-- iOS home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weather">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <form id="search-form" class="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="Search city" aria-label="Search city" enterkeyhint="search">
        <ul id="search-results" class="results" hidden></ul>
      </form>
      <button id="locate-btn" class="icon-btn" title="Use my location" aria-label="Use my location">📍</button>
      <button id="unit-btn" class="icon-btn" title="Toggle units" aria-label="Toggle units">°F</button>
    </header>

    <p id="status" class="status" hidden></p>

    <section id="weather" hidden>
      <div class="current">
        <h1 id="place"></h1>
        <div id="current-icon" class="big-icon"></div>
        <div id="current-temp" class="big-temp"></div>
        <div id="current-desc" class="desc"></div>
        <div id="current-range" class="range"></div>
      </div>

      <div class="card">
        <h2>Next 24 hours</h2>
        <div id="hourly" class="hourly"></div>
      </div>

      <div class="card">
        <h2>7-day forecast</h2>
        <ul id="daily" class="daily"></ul>
      </div>

      <div class="card details" id="details"></div>

      <p class="credit">Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
